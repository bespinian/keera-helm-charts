name: Release Charts

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # needed to create tags and GitHub releases
      packages: write # needed for ghcr access

    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.0.5

      - name: Login to Helm OCI Registry
        env:
          HELM_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          HELM_USERNAME: ${{ github.actor }}
        run: |
          echo "$HELM_PASSWORD" | helm registry login ghcr.io \
            --username "$HELM_USERNAME" \
            --password-stdin

      - name: Push new chart versions to GHCR and create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry="oci://ghcr.io/${GITHUB_REPOSITORY}"
          mkdir -p .packages
          for chart in charts/*/; do
            name=$(yq '.name' "${chart}Chart.yaml")
            version=$(yq '.version' "${chart}Chart.yaml")
            tag="${name}-${version}"

            pushed=false
            if out=$(helm show chart "${registry}/${name}" --version "$version" 2>&1); then
              pushed=true
            elif ! grep -qi "not found" <<< "$out"; then
              echo "Failed to check ${name}:${version} in ${registry}: ${out}" >&2
              exit 1
            fi

            released=false
            if out=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" 2>&1); then
              released=true
            elif ! grep -qi "not found" <<< "$out"; then
              echo "Failed to check release ${tag}: ${out}" >&2
              exit 1
            fi

            if [ "$pushed" = true ] && [ "$released" = true ]; then
              echo "${tag} already published, skipping"
              continue
            fi

            helm package "$chart" --destination .packages
            package=".packages/${tag}.tgz"

            if [ "$pushed" = false ]; then
              echo "Pushing ${name}:${version} to ${registry}"
              helm push "$package" "$registry"
            fi

            if [ "$released" = false ]; then
              echo "Creating tag and release ${tag}"
              gh release create "$tag" "$package" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$tag" \
                --generate-notes
            fi
          done
