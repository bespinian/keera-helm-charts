{{- if not .Values.credentials.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keera-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  KEERA_OPERATOR_KEY: {{ required "credentials.operatorKey or credentials.existingSecret.name is required" .Values.credentials.operatorKey | b64enc | quote }}
  KEERA_SECRET_KEY: {{ required "credentials.secretKey or credentials.existingSecret.name is required" .Values.credentials.secretKey | b64enc | quote }}
{{- end }}
