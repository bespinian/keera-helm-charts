{{- if eq .Values.database.type "internal" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keera-gateway.database.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-gateway.database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "keera-gateway.database.selectorLabels" . | nindent 4 }}
{{- end }}
