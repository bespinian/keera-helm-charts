{{- if and (eq .Values.database.type "internal") (not .Values.database.internal.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keera-gateway.database.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-gateway.database.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ required "database.internal.password or database.internal.existingSecret is required" .Values.database.internal.password | b64enc | quote }}
{{- end }}
