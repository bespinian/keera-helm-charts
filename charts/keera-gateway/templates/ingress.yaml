{{- if .Values.gateway.ingress.enabled -}}
{{- $ingress := .Values.gateway.ingress -}}
{{- $fullName := include "keera-gateway.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-gateway.labels" . | nindent 4 }}
    {{- with $ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ $ingress.path }}
            pathType: {{ $ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.gateway.service.port }}
      {{- with $ingress.hostname }}
      host: {{ . | quote }}
      {{- end }}
    {{- range $ingress.extraHosts }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ .path | default $ingress.path }}
            pathType: {{ .pathType | default $ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $.Values.gateway.service.port }}
    {{- end }}
  {{- if or $ingress.tls $ingress.extraTls }}
  tls:
    {{- if $ingress.tls }}
    - hosts:
        {{- with $ingress.hostname }}
        - {{ . | quote }}
        {{- end }}
        {{- range $ingress.extraHosts }}
        - {{ .name | quote }}
        {{- end }}
      secretName: {{ $fullName }}-tls
    {{- end }}
    {{- with $ingress.extraTls }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
