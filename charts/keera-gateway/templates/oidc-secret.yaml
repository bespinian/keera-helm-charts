{{- include "keera-gateway.oidc.validate" . }}
{{- if .Values.oidc.enabled }}
{{- $data := dict }}
{{- range $p := (include "keera-gateway.oidc.providers" . | fromYaml).providers }}
{{- if not $p.existingSecret }}
{{- $_ := set $data (printf "KEERA_OIDC_%s_CLIENT_SECRET" (include "keera-gateway.oidc.segment" $p.name)) $p.clientSecret }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keera-gateway.oidc.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
