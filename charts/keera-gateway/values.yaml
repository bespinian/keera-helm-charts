# -- Overrides the chart name.
nameOverride: ""
# -- Overrides the full name of the release's resources.
fullnameOverride: ""

# -- Secrets to pull the gateway and internal database images with. See
# https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

credentials:
  # -- Operator key. Required unless existingSecret.name is set.
  operatorKey: ""
  # -- Secret key. Required unless existingSecret.name is set.
  secretKey: ""
  existingSecret:
    # -- Use this existing Secret instead. When set, operatorKey and secretKey
    # above are ignored.
    name: ""
    # -- Key in the existing Secret holding the operator key.
    operatorSecretKey: KEERA_OPERATOR_KEY
    # -- Key in the existing Secret holding the secret key.
    secretSecretKey: KEERA_SECRET_KEY

# -- Emails that are operators. The operator role is never assignable through the
# panel, the CLI or the API, so this and oidc.operatorGroups are the only two
# things that grant it.
operators: []
#   - you@yourcompany.ch

# -- Host names inside the network that organisations may reach, such as
# keera-engine, or "none" or "all". Empty is all. Required with oidc.signup, by
# default a stranger's organisation reaches the whole private network.
upstreamPrivate: ""

# -- The address a browser reaches the gateway on, without a path, such as
# https://keera.example.ch. Single sign-on returns to its
# /control/auth/callback, which every provider's client registration has to
# list, so it is required when oidc.enabled is true. Passkeys and payments need
# it too.
publicUrl: ""

# -- Lets administrators create accounts that sign in with a passkey, with or
# without OIDC. Requires publicUrl with its scheme, which has to be https (or
# http on localhost) and not an IP address, or the install fails. A passkey
# belongs to that host name, so changing it later breaks every passkey.
# See https://github.com/bespinian/keera-gateway/blob/main/docs/sso.md#passkeys.
passkeys: false

# Single sign-on for the control panel. Without it the panel accepts only the
# operator key, and audit entries cannot name a person.
# See https://github.com/bespinian/keera-gateway/blob/main/docs/sso.md.
oidc:
  # -- Turn on single sign-on.
  enabled: false

  # One directory: leave `providers` below empty and fill these in.
  # -- Name of the single provider. It is chosen once, see `providers` below.
  name: sso
  # -- What the sign-in button says. Empty capitalises the name.
  label: ""
  # -- Issuer URL, such as https://login.microsoftonline.com/<tenant>/v2.0.
  issuer: ""
  # -- Client ID.
  clientId: ""
  # -- Client secret. Required unless existingSecret is set.
  clientSecret: ""
  # -- Use an existing Secret for the client secret instead.
  existingSecret: ""
  # -- Key in the existing Secret holding the client secret.
  existingSecretKey: clientSecret

  # -- Several directories: a sign-in button per entry, each with a client of its
  # own. Setting this ignores the single-directory fields above; everything from
  # `adminGroups` down is copied to every entry, and an entry may override it.
  # Each entry needs `domains` with several providers. A name is chosen once. It
  # goes in the sign-in URL and in every identity that provider writes, so
  # changing one orphans everybody who signed in through it.
  providers: []
  # - name: google
  #   issuer: https://accounts.google.com
  #   clientId: ""
  #   clientSecret: ""
  #   # Or an existing Secret of its own:
  #   existingSecret: ""
  #   existingSecretKey: clientSecret
  # - name: entra
  #   issuer: https://login.microsoftonline.com/<tenant>/v2.0
  #   clientId: ""
  #   clientSecret: ""
  #   # Entra's groups claim carries object GUIDs rather than names, app roles avoid that.
  #   groupsClaim: roles
  #   adminGroups: [keera-admins]
  #   # What the button says. Empty gives "Microsoft" for a provider named
  #   # entra, azure, azuread, microsoft or m365.
  #   label: ""

  # -- Set adminGroups and the directory owns the administrator role: it is read on
  # every sign-in, and the panel, the CLI and the API stop assigning roles. Leave
  # it empty to make administrators with `keera user role`.
  adminGroups: []
  # -- Groups whose members are operators.
  operatorGroups: []
  # -- Claim holding the groups. Empty is "groups".
  groupsClaim: ""
  # -- Role of a person matching no group: operator, admin or member. Empty is member.
  defaultRole: ""
  # -- Further scopes to request.
  scopes: []
  # -- Email domains a provider may sign people in with, ["*"] for any. Required
  # with several providers, so one directory cannot vouch for another's addresses.
  domains: []
  # -- Lets someone whose sign-in matches no organisation create one.
  signup: false

gateway:
  # -- Number of replicas.
  replicaCount: 1

  image:
    # -- Image of the gateway.
    repository: ghcr.io/bespinian/keera-gateway
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""

  serviceAccount:
    # -- Create a ServiceAccount.
    create: true
    # -- Mount the ServiceAccount's API credentials.
    automount: true
    # -- Annotations of the ServiceAccount.
    annotations: {}
    # -- Name of the ServiceAccount. Empty is the full name when create is true,
    # and the namespace's default otherwise.
    name: ""

  # -- Annotations of the pods.
  podAnnotations: {}
  # -- Labels of the pods.
  podLabels: {}

  # -- Security context of the pods.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Security context of the gateway container.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    # -- Type of the Service.
    type: ClusterIP
    # -- Port of the Service.
    port: 80

  # Expose the gateway through an Ingress.
  # See https://kubernetes.io/docs/concepts/services-networking/ingress/
  ingress:
    # -- Create an Ingress.
    enabled: false
    # -- IngressClass of the Ingress.
    ingressClassName: ""
    # -- Annotations of the Ingress.
    annotations: {}
    # -- Labels of the Ingress.
    labels: {}
    # -- Host name of the Ingress. Empty matches any host.
    hostname: ""
    # -- Path of the Ingress.
    path: /
    # -- Path type of the Ingress.
    pathType: Prefix
    # -- TLS for hostname and extraHosts from the Secret <fullname>-tls.
    tls: false
    # -- Further host names, path and pathType default to the ones above.
    extraHosts: []
    # - name: keera.example.com
    #   path: /
    # -- Further TLS entries.
    extraTls: []
    # - hosts:
    #     - keera.example.com
    #   secretName: keera-example-tls

  # Expose the gateway through a Gateway API HTTPRoute, which needs the Gateway
  # API CRDs and a controller. See https://gateway-api.sigs.k8s.io/guides/
  httpRoute:
    # -- Create an HTTPRoute.
    enabled: false
    # -- Annotations of the HTTPRoute.
    annotations: {}
    # -- Labels of the HTTPRoute.
    labels: {}
    # -- Gateways the route attaches to.
    parentRefs: []
    # - name: gateway
    #   namespace: gateway
    #   sectionName: https
    # -- Host names of the HTTPRoute. Empty matches any host.
    hostnames: []
    # -- Rules of the HTTPRoute. The backend is always the gateway's service;
    # each rule may set matches, filters and timeouts.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        # filters: []
        # timeouts:
        #   request: 30s

  # -- Resources of the gateway container.
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   memory: 128Mi

  # See https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    # -- Create a HorizontalPodAutoscaler, which then sets the replicas.
    enabled: false
    # -- The fewest replicas.
    minReplicas: 1
    # -- The most replicas.
    maxReplicas: 100
    # -- CPU utilization to scale at.
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # -- Further volumes of the pods.
  volumes: []
    # - name: foo
    #   secret:
    #     secretName: mysecret
    #     optional: false

  # -- Further volume mounts of the gateway container.
  volumeMounts: []
    # - name: foo
    #   mountPath: "/etc/foo"
    #   readOnly: true

  # -- Node selector of the pods.
  nodeSelector: {}

  # -- Tolerations of the pods.
  tolerations: []

  # -- Affinity of the pods.
  affinity: {}

database:
  # The gateway's PostgreSQL instance, deployed as part of this release.
  internal:
    image:
      # -- Image of PostgreSQL.
      repository: docker.io/library/postgres
      # -- Tag of the PostgreSQL image.
      tag: "18"
      # -- Image pull policy.
      pullPolicy: IfNotPresent
    # -- Superuser created on first start, also owner of the database below.
    username: keera
    # -- Database created on first start.
    database: keera_gateway
    # -- Password of the superuser. Required unless existingSecret is set.
    password: ""
    # -- Use an existing Secret for the password instead of creating one.
    existingSecret: ""
    # -- Key in the existing Secret holding the password.
    existingSecretPasswordKey: password
    # -- Security context of the pod. The official image runs PostgreSQL as
    # uid/gid 999.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    # -- Security context of the PostgreSQL container.
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    # -- Resources of the PostgreSQL container.
    resources: {}
      # requests:
      #   cpu: 100m
      #   memory: 256Mi
    # -- Liveness probe timings.
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    # -- Readiness probe timings.
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    # -- Size limit of /dev/shm, PostgreSQL uses it for shared_buffers.
    shmSizeLimit: 512Mi
    # -- Further environment variables of the PostgreSQL container.
    extraEnvVars: []
    # -- Annotations of the pod.
    podAnnotations: {}
    # -- Labels of the pod.
    podLabels: {}
    # -- Node selector of the pod.
    nodeSelector: {}
    # -- Tolerations of the pod.
    tolerations: []
    # -- Affinity of the pod.
    affinity: {}
    persistence:
      # -- Store data on a PersistentVolumeClaim. If disabled, data is stored in
      # an emptyDir and lost when the pod is deleted.
      enabled: true
      # -- Use an existing PersistentVolumeClaim instead of creating one.
      existingClaim: ""
      # -- Empty uses the cluster default StorageClass, "-" disables dynamic provisioning.
      storageClass: ""
      # -- Access mode of the PersistentVolumeClaim.
      accessMode: ReadWriteOnce
      # -- Size of the PersistentVolumeClaim.
      size: 1Gi
      # -- Annotations of the PersistentVolumeClaim.
      annotations: {}
