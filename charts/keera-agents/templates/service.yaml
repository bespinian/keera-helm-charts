apiVersion: v1
kind: Service
metadata:
  name: {{ include "keera-agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-agents.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "keera-agents.selectorLabels" . | nindent 4 }}
