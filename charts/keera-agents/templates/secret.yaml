{{- if not .Values.credentials.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keera-agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-agents.labels" . | nindent 4 }}
type: Opaque
data:
  KEERA_AGENTS_SERVICE_KEY: {{ .Values.credentials.serviceKey | b64enc | quote }}
  KEERA_AGENTS_SECRET_KEY: {{ .Values.credentials.secretKey | b64enc | quote }}
  {{- with .Values.credentials.metricsToken }}
  KEERA_AGENTS_METRICS_TOKEN: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
