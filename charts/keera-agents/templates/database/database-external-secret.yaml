{{- if and (eq .Values.database.type "external") (not .Values.database.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keera-agents.database.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keera-agents.labels" . | nindent 4 }}
type: Opaque
data:
  url: {{ required "database.external.url or database.external.existingSecret is required" .Values.database.external.url | b64enc | quote }}
{{- end }}
